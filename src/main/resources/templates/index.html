<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
    PAINEL do sistema (página inicial): os indicadores mais importantes para quem gerencia o negócio.
    Os dados vêm do InicioController, que chama o PainelService.
-->
<head th:replace="~{fragments/layout :: head('Painel')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Painel</h1>
        <span class="text-muted small" th:text="'Atualizado em ' + ${#temporals.format(agora, 'dd/MM/yyyy HH:mm')}">Atualizado em</span>
    </div>

    <!-- Cartões de indicadores: th:each repete o cartão para cada indicador da lista -->
    <div class="row g-3">
        <div class="col-sm-6 col-lg-3" th:each="ind : ${indicadores}">
            <div class="card shadow-sm h-100 border-0 border-start border-4" th:classappend="'border-' + ${ind.cor}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <span class="text-muted small" th:text="${ind.titulo}">Indicador</span>
                        <i class="bi fs-4" th:classappend="${ind.icone} + ' text-' + ${ind.cor}"></i>
                    </div>
                    <div class="fs-3 fw-semibold" th:text="${ind.valor}">0</div>
                    <div class="small text-muted" th:text="${ind.detalhe}">detalhe</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <!-- Lista de atenção: o que precisa de ação agora -->
        <div class="col-12">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white fw-semibold"><i class="bi bi-exclamation-circle me-1"></i> Ordens não concluídas (mais antigas primeiro)</div>
                <div class="card-body" th:if="${#lists.isEmpty(atencao)}">
                    <p class="text-muted mb-0">Nenhuma ordem pendente.</p>
                </div>
                <div class="table-responsive" th:unless="${#lists.isEmpty(atencao)}">
                    <table class="table table-sm mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                        <th>Abertura</th>
                        <th>Cliente</th>
                        <th>Equipamento</th>
                        <th>Situação</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ordem : ${atencao}">
                        <td th:text="${#temporals.format(ordem.dataAbertura, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${ordem.cliente.nome}">Cliente</td>
                        <td th:text="${ordem.equipamento}">Equipamento</td>
                        <td><span class="badge" th:classappend="'text-bg-' + ${ordem.status.cor}" th:text="${ordem.status.descricao}">Aberta</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white">
                    <a th:href="@{/ordens}" class="small">Ver todas as ordens <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
