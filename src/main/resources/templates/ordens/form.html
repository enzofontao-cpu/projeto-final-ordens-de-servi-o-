<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ordens de serviço')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <!-- O mesmo formulário serve para cadastrar (id vazio) e para editar (id preenchido) -->
    <h1 class="h4 mb-3" th:text="${ordemServico.id == null} ? 'Nova ordem de serviço' : 'Editar ordem de serviço'">Nova ordem de serviço</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- th:object liga o formulário ao objeto "ordemServico"; *{campo} = um atributo desse objeto -->
            <form th:action="@{/ordens/salvar}" th:object="${ordemServico}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="cliente">Cliente *</label>
                        <!-- Lista de escolha: cada opção envia o id; o conversor (config/Conversores.java) transforma o id no objeto -->
                        <select id="cliente" name="cliente" class="form-select" th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="item : ${clientes}" th:value="${item.id}" th:text="${item.nome}"
                                    th:selected="${ordemServico.cliente != null and ordemServico.cliente.id == item.id}">Cliente</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="tecnico">Técnico *</label>
                        <!-- Lista de escolha: cada opção envia o id; o conversor (config/Conversores.java) transforma o id no objeto -->
                        <select id="tecnico" name="tecnico" class="form-select" th:classappend="${#fields.hasErrors('tecnico')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="item : ${tecnicos}" th:value="${item.id}" th:text="${item.nome + ' · ' + item.especialidade}"
                                    th:selected="${ordemServico.tecnico != null and ordemServico.tecnico.id == item.id}">Técnico</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('tecnico')}" th:errors="*{tecnico}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="equipamento">Equipamento *</label>
                        <input type="text" class="form-control" th:field="*{equipamento}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('equipamento')}" th:errors="*{equipamento}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="dataAbertura">Abertura *</label>
                        <input type="date" class="form-control" th:field="*{dataAbertura}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataAbertura')}" th:errors="*{dataAbertura}">Erro</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="defeitoRelatado">Defeito relatado *</label>
                        <textarea class="form-control" rows="3" th:field="*{defeitoRelatado}" th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('defeitoRelatado')}" th:errors="*{defeitoRelatado}">Erro</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="diagnostico">Diagnóstico</label>
                        <textarea class="form-control" rows="3" th:field="*{diagnostico}" th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('diagnostico')}" th:errors="*{diagnostico}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="valor">Valor</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{valor}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}">Erro</div>
                    </div>
                </div>
                <p class="text-muted small mt-3 mb-0">* Campos obrigatórios</p>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-app"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/ordens}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
